<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Grid — Auto Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f4f1ec;
      font-family: 'EB Garamond', serif;
    }

    .variant-header {
      padding: 3.5rem 2.5rem 1.5rem;
    }
    .variant-header:first-child { padding-top: 2rem; }
    .variant-header h2 {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: 2rem;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }
    .variant-header .meta {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #666;
      margin-top: 0.4rem;
    }

    .portfolio-grid { width: 100%; }
    .portfolio-grid > * {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Variant 1: seed 0 (default) — no data-layout, auto-generated -->
  <header class="variant-header">
    <h2>variant 1</h2>
    <div class="meta">17 items &bull; auto-layout &bull; seed 0</div>
  </header>

  <div class="portfolio-grid" data-seed="0">
    <img src="samples/sample-01.png" alt="Bose">
    <img src="samples/sample-02.png" alt="Crocs">
    <img src="samples/sample-03.png" alt="Miu Miu">
    <img src="samples/sample-04.png" alt="Fendi">
    <img src="samples/sample-05.png" alt="AXA">
    <img src="samples/sample-06.png" alt="Coach">
    <img src="samples/sample-07.png" alt="Anta">
    <img src="samples/sample-08.png" alt="Fila">
    <img src="samples/sample-09.png" alt="Champion">
    <img src="samples/sample-10.png" alt="Popsocket">
    <img src="samples/sample-11.png" alt="Lego">
    <img src="samples/sample-12.png" alt="PP">
    <img src="samples/sample-13.png" alt="JDMALL">
    <img src="samples/sample-14.png" alt="Gugu">
    <img src="samples/sample-15.png" alt="GQ">
    <img src="samples/sample-16.png" alt="HK series">
    <img src="samples/sample-17.png" alt="Furrytail">
  </div>


  <!-- Variant 2: seed 42 — same 17 images, shuffled order, different layout -->
  <header class="variant-header">
    <h2>variant 2</h2>
    <div class="meta">17 items &bull; auto-layout &bull; seed 42</div>
  </header>

  <div class="portfolio-grid" data-seed="42">
    <img src="samples/sample-17.png" alt="Furrytail">
    <img src="samples/sample-06.png" alt="Coach">
    <img src="samples/sample-11.png" alt="Lego">
    <img src="samples/sample-02.png" alt="Crocs">
    <img src="samples/sample-14.png" alt="Gugu">
    <img src="samples/sample-09.png" alt="Champion">
    <img src="samples/sample-04.png" alt="Fendi">
    <img src="samples/sample-16.png" alt="HK series">
    <img src="samples/sample-01.png" alt="Bose">
    <img src="samples/sample-08.png" alt="Fila">
    <img src="samples/sample-13.png" alt="JDMALL">
    <img src="samples/sample-05.png" alt="AXA">
    <img src="samples/sample-10.png" alt="Popsocket">
    <img src="samples/sample-03.png" alt="Miu Miu">
    <img src="samples/sample-15.png" alt="GQ">
    <img src="samples/sample-07.png" alt="Anta">
    <img src="samples/sample-12.png" alt="PP">
  </div>


  <!-- Variant 3: seed 99 — same 17 images, reversed order, different layout -->
  <header class="variant-header">
    <h2>variant 3</h2>
    <div class="meta">17 items &bull; auto-layout &bull; seed 99</div>
  </header>

  <div class="portfolio-grid" data-seed="99">
    <img src="samples/sample-12.png" alt="PP">
    <img src="samples/sample-07.png" alt="Anta">
    <img src="samples/sample-15.png" alt="GQ">

  <script src="../../js/portfolio-grid.js"></script>

</body>
</html>
