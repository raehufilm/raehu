  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --site-header-height: 3.25rem;
      --tracker-left: 2rem;
      --tracker-content-space: 5.75rem;
      --work-page-padding: 3rem;
      --work-page-padding-double: calc(var(--work-page-padding) + var(--work-page-padding));
    }

    body {
      background: #0a0a0a;

    body.highlight-expanded {
      overflow: hidden;

    html { scroll-behavior: smooth; }

    /* --- Site header --- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--site-header-height);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 2rem;
      background: #0a0a0a;
    }

    .site-header-brand {
      font-family: 'EB Garamond', serif;
      font-size: 0.94rem;
      line-height: 1;
      letter-spacing: 0.12em;
      color: #f4f1ec;
      text-decoration: none;
      text-transform: lowercase;
      white-space: nowrap;
    }

    /* --- Page structure --- */
    .work-pages {
      width: 100%;
      padding-top: var(--site-header-height);
      padding-left: var(--tracker-content-space);
    }

    .work-page {
      --page-padding: 0rem;
      --page-padding-double: 0rem;
      position: relative;
      width: 100%;
      scroll-margin-top: 0;
    }

    .work-page[data-page-padding] {
      --page-padding: var(--work-page-padding);
      --page-padding-double: var(--work-page-padding-double);
    }

    .work-page--bts {
      --page-padding-top: 6rem;
      min-height: calc(100vh - var(--site-header-height));
    }

    /* --- Section tracker --- */
    .section-tracker {
      position: fixed;
      top: 50%;
      left: var(--tracker-left);
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .section-tracker a {
      display: block;
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      line-height: 1.1;
      color: #6f6f6f;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .section-tracker-dot {
      --red-dot-size: 0.42em;
      --red-dot-offset-y: 0;
      margin-right: 0.45em;
      visibility: hidden;
    }

    .section-tracker a[aria-current="true"] {
      color: #f4f1ec;
    }

    .section-tracker a[aria-current="true"] .section-tracker-dot {
      visibility: visible;
    }

    .section-tracker a:hover {
      color: #f4f1ec;
    }

    /* --- Trailer facade --- */
    .trailer-wrap {
      position: relative;
      width: calc(100% - var(--page-padding-double));
      height: calc(100vh - var(--site-header-height) - var(--page-padding));
      margin: 0 var(--page-padding) var(--page-padding);
      background: #000;
      cursor: pointer;
      overflow: hidden;
    }

    .trailer-wrap--media {
      cursor: default;
    }

    .trailer-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .trailer-poster--placeholder {
      background: #000;
    }

    .trailer-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 2s ease;
    }

    .trailer-play:hover { opacity: 1; }

    .trailer-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* --- Header block: text + hero image --- */
    .work-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }

    .work-header-text {
      padding: 3.25rem var(--page-padding) 6.5rem var(--page-padding);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .work-title {
      font-family: 'EB Garamond', serif;
      font-weight: 500;
      font-size: 2rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-bottom: 1.8rem;
    }

    .work-subtext {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: 1.2rem;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 2.5rem;
    }

    .work-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #f4f1ec;
    }

    .red-dot {
      --red-dot-size: 8px;
      --red-dot-color: #c0392b;
      --red-dot-offset-y: 0;
      display: block;
      width: var(--red-dot-size);
      height: var(--red-dot-size);
      background: var(--red-dot-color);
      border-radius: 50%;
      flex-shrink: 0;
      transform: translateY(var(--red-dot-offset-y));
      animation: pulse 1.6s ease-in-out infinite;
    }

    .section-tracker .red-dot {
      display: inline-block;
      vertical-align: baseline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .red-dot { animation: none; }
    }

    @media (max-width: 640px) {
      .site-header { padding: 0 1rem; }
    }

    .work-header-image-wrap {
      padding: 3.25rem var(--page-padding) 6.5rem 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .work-header-image {
      max-width: 100%;
      max-height: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* --- Grid wrapper (insets the slideshow + stills from screen edges) --- */
    .grid-wrapper {
      padding: var(--page-padding) var(--page-padding) 0;
    }

    /* --- Stills grid --- */
    .portfolio-grid { width: 100%; }
    .portfolio-grid > * {
      width: 100%;
      height: 100%;
      display: block;
    }

    .portfolio-grid > img,
    .portfolio-grid > video {
      object-fit: cover;
    }

    .highlight-tile {
      position: relative;
      background: #000;
      cursor: pointer;
    }

    .highlight-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .highlight-expand-button,
    .highlight-collapse-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 0;
      background: transparent;
      color: #f4f1ec;
      cursor: pointer;
      opacity: 0;
      padding: 0;
      transition: opacity 0.25s ease;
    }

    .highlight-expand-button {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .highlight-expand-button:hover,
    .highlight-expand-button:focus-visible,
    .highlight-collapse-button:hover,
    .highlight-collapse-button:focus-visible {
      outline: 0;
      opacity: 1;
    }

    .highlight-tile:hover .highlight-expand-button {
      opacity: 1;
    }

    .highlight-expand-button svg,
    .highlight-collapse-button svg {
      width: 1.55rem;
      height: 1.55rem;
      stroke: currentColor;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0.08rem 0.35rem rgba(0, 0, 0, 0.7));
    }

    .highlight-lightbox {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0);
      opacity: 0;
      pointer-events: none;
      transition: background 0.5s ease, opacity 0.5s ease;
    }

    .highlight-lightbox.is-open {
      background: rgba(0, 0, 0, 0.74);
      opacity: 1;
      pointer-events: auto;
    }

    .highlight-lightbox-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .highlight-lightbox-frame {
      position: fixed;
      overflow: hidden;
      background: #000;
      pointer-events: auto;
      transition:
        left 0.68s cubic-bezier(0.16, 1, 0.3, 1),
        top 0.68s cubic-bezier(0.16, 1, 0.3, 1),
        width 0.68s cubic-bezier(0.16, 1, 0.3, 1),
        height 0.68s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: left, top, width, height;
    }

    .highlight-lightbox-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .highlight-lightbox-frame.is-expanded .highlight-lightbox-media {
      object-fit: contain;
    }

    .highlight-collapse-button {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .highlight-lightbox-frame:hover .highlight-collapse-button,
    .highlight-lightbox-frame:focus-within .highlight-collapse-button {
      opacity: 1;
    }

    @media (hover: none) {
      .highlight-expand-button,
      .highlight-collapse-button {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .highlight-lightbox,
      .highlight-lightbox-frame {
        transition: none;
      }
    }

    .bts-layout {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(16rem, 3fr);
      gap: var(--page-padding);
      min-height: calc(100vh - var(--site-header-height));
      padding: var(--page-padding-top, var(--page-padding)) var(--page-padding) var(--page-padding);
      align-items: stretch;
    }

    .bts-slideshow {
      position: relative;
      min-height: calc(100vh - var(--site-header-height) - var(--page-padding-top, var(--page-padding)) - var(--page-padding));
      overflow: hidden;
      background: #000;
    }

    .bts-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .bts-slide.is-active {
      opacity: 1;
    }

    .bts-slide-control {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border: 0;
      background: transparent;
      color: #f4f1ec;
      cursor: pointer;
      opacity: 0;
      padding: 0;
      transform: translateY(-50%);
      transition: opacity 0.25s ease;
    }

    .bts-slide-control--prev {
      left: 1rem;
    }

    .bts-slide-control--next {
      right: 1rem;
    }

    .bts-slide-control:hover,
    .bts-slide-control:focus-visible {
      outline: 0;
    }

    .bts-slideshow:hover .bts-slide-control,
    .bts-slide-control:focus-visible {
      opacity: 1;
    }

    .bts-slide-control svg {
      width: 2rem;
      height: 2rem;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .bts-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-end;
      text-align: right;
    }

    .bts-text {
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #b8b8b8;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="site-header-brand" href="https://raehu.com/">rae hu 樂瑞</a>
  </header>

  <nav class="section-tracker" aria-label="Project sections">
{{SECTION_TRACKER_LINKS}}
  </nav>

  <main class="work-pages" data-work="{{WORK_SLUG}}">
{{WORK_SECTIONS}}
  </main>

  <div class="highlight-lightbox" data-highlight-lightbox aria-hidden="true">
    <div class="highlight-lightbox-stage" data-highlight-lightbox-stage></div>
  </div>

  <script src="{{PORTFOLIO_GRID_JS_URL}}"></script>
  <script>
    // Trailer facade: swap poster for iframe on click
    (function () {
      var wrap = document.getElementById('trailer-player');
      if (!wrap) return;

      wrap.addEventListener('click', function () {
        var iframe = document.createElement('iframe');
        iframe.src = wrap.getAttribute('data-vimeo-embed');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
        iframe.setAttribute('allowfullscreen', '');
        wrap.innerHTML = '';
        wrap.appendChild(iframe);
        wrap.style.cursor = 'default';
      });
    })();

    // Highlight media expansion
    (function () {
      var lightbox = document.querySelector('[data-highlight-lightbox]');
      var stage = document.querySelector('[data-highlight-lightbox-stage]');
      var active = null;

      if (!lightbox || !stage) return;

      function setFrameRect(frame, rect) {
        frame.style.left = rect.left + 'px';
        frame.style.top = rect.top + 'px';
        frame.style.width = rect.width + 'px';
        frame.style.height = rect.height + 'px';
      }

      function mediaAspectRatio(media) {
        if (media.tagName === 'IMG' && media.naturalWidth && media.naturalHeight) {
          return media.naturalWidth / media.naturalHeight;
        }

        if (media.tagName === 'VIDEO' && media.videoWidth && media.videoHeight) {
          return media.videoWidth / media.videoHeight;
        }

        var rect = media.getBoundingClientRect();
        return rect.width && rect.height ? rect.width / rect.height : 16 / 9;
      }

      function expandedRectFor(grid, aspectRatio) {
        var gridRect = grid.getBoundingClientRect();
        var viewportPadding = 24;
        var maxWidth = Math.min(gridRect.width, window.innerWidth - viewportPadding * 2);
        var maxHeight = window.innerHeight - viewportPadding * 2;
        var width = Math.max(0, maxWidth);
        var height = width / aspectRatio;

        if (height > maxHeight) {
          height = Math.max(0, maxHeight);
          width = height * aspectRatio;
        }

        var left = gridRect.left + (gridRect.width - width) / 2;
        var top = (window.innerHeight - height) / 2;

        left = Math.max(viewportPadding, Math.min(left, window.innerWidth - width - viewportPadding));
        top = Math.max(viewportPadding, Math.min(top, window.innerHeight - height - viewportPadding));

        return {
          left: Math.round(left),
          top: Math.round(top),
          width: Math.round(width),
          height: Math.round(height)
        };
      }

      function makeCollapseButton() {
        var button = document.createElement('button');
        button.className = 'highlight-collapse-button';
        button.type = 'button';
        button.setAttribute('aria-label', 'Collapse highlight media');
        button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="interactive-chevron interactive-chevron--collapse-ne" d="M21 9h-6V3"></path><path class="interactive-chevron interactive-chevron--collapse-sw" d="M3 15h6v6"></path></svg>';
        return button;
      }

      function prepareClone(media) {
        var clone = media.cloneNode(true);
        clone.className = 'highlight-lightbox-media';
        clone.removeAttribute('id');

        if (clone.tagName === 'VIDEO') {
          clone.muted = true;
          clone.loop = true;
          clone.playsInline = true;
          clone.autoplay = true;
          try {
            clone.currentTime = media.currentTime || 0;
          } catch (error) {}
          window.setTimeout(function () {
            var play = clone.play && clone.play();
            if (play && play.catch) play.catch(function () {});
          }, 0);
        }

        return clone;
      }

      function closeExpanded() {
        if (!active) return;

        var closing = active;
        var frame = closing.frame;
        var originRect = closing.tile.getBoundingClientRect();
        var cleanupDone = false;

        active = null;
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        frame.classList.remove('is-expanded');
        setFrameRect(frame, originRect);

        function cleanup() {
          if (cleanupDone) return;
          cleanupDone = true;
          stage.innerHTML = '';
          document.body.classList.remove('highlight-expanded');
          if (closing.returnFocus) {
            closing.expandButton.focus({ preventScroll: true });
          } else {
            closing.expandButton.blur();
          }
        }

        frame.addEventListener('transitionend', cleanup, { once: true });
        window.setTimeout(cleanup, 760);
      }

      function openExpanded(expandButton, returnFocus) {
        var tile = expandButton.closest('[data-highlight-tile]');
        var media = tile && tile.querySelector('.highlight-media');
        var grid = tile && tile.closest('.portfolio-grid');

        if (!tile || !media || !grid || active) return;

        var originRect = tile.getBoundingClientRect();
        var aspectRatio = mediaAspectRatio(media);
        var targetRect = expandedRectFor(grid, aspectRatio);
        var frame = document.createElement('div');
        var closeButton = makeCollapseButton();

        frame.className = 'highlight-lightbox-frame';
        frame.appendChild(prepareClone(media));
        frame.appendChild(closeButton);
        stage.innerHTML = '';
        stage.appendChild(frame);
        setFrameRect(frame, originRect);
        frame.getBoundingClientRect();

        active = {
          tile: tile,
          grid: grid,
          frame: frame,
          aspectRatio: aspectRatio,
          expandButton: expandButton,
          returnFocus: returnFocus
        };

        document.body.classList.add('highlight-expanded');
        lightbox.setAttribute('aria-hidden', 'false');

        closeButton.addEventListener('click', function (event) {
          event.stopPropagation();
          closeExpanded();
        });

        requestAnimationFrame(function () {
          lightbox.classList.add('is-open');
          frame.classList.add('is-expanded');
          setFrameRect(frame, targetRect);
        });
      }

      document.querySelectorAll('[data-highlight-expand]').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          openExpanded(button, event.detail === 0);
        });
      });

      document.querySelectorAll('[data-highlight-tile]').forEach(function (tile) {
        var button = tile.querySelector('[data-highlight-expand]');
        if (!button) return;

        tile.addEventListener('click', function (event) {
          if (event.target.closest('[data-highlight-expand]')) return;
          openExpanded(button, false);
        });
      });

      lightbox.addEventListener('click', function (event) {
        closeExpanded();
      });

      window.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeExpanded();
      });

      window.addEventListener('resize', function () {
        if (!active) return;
        setFrameRect(active.frame, expandedRectFor(active.grid, active.aspectRatio));
      });
    })();

    // BTS slideshow
    (function () {
      document.querySelectorAll('.bts-slideshow').forEach(function (slideshow) {
        var slides = Array.prototype.slice.call(slideshow.querySelectorAll('.bts-slide'));
        if (slides.length < 2) return;

        var current = 0;
        var timer = null;

        function showSlide(nextIndex) {
          slides[current].classList.remove('is-active');
          current = (nextIndex + slides.length) % slides.length;
          slides[current].classList.add('is-active');
        }

        function startTimer() {
          window.clearInterval(timer);
          timer = window.setInterval(function () {
            showSlide(current + 1);
          }, 3500);
        }

        slideshow.querySelectorAll('[data-bts-slide-control]').forEach(function (control) {
          control.addEventListener('click', function () {
            var direction = control.getAttribute('data-bts-slide-control');
            showSlide(current + (direction === 'next' ? 1 : -1));
            startTimer();
          });
        });

        startTimer();
      });
    })();

    // Section tracker: update active label and smooth-scroll on click
    (function () {
      var sections = Array.prototype.slice.call(document.querySelectorAll('[data-section-page]'));
      var links = Array.prototype.slice.call(document.querySelectorAll('[data-section-link]'));
      var ticking = false;

      function setActive(sectionName) {
        links.forEach(function (link) {
          var isActive = link.getAttribute('data-section-link') === sectionName;
          if (isActive) {
            link.setAttribute('aria-current', 'true');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      }

      function updateActiveSection() {
        var anchorY = window.innerHeight * 0.4;
        var active = sections[0];

        sections.forEach(function (section) {
          var rect = section.getBoundingClientRect();
          if (rect.top <= anchorY) {
            active = section;
          }
        });

        if (active) {
          setActive(active.getAttribute('data-section-page'));
        }

        ticking = false;
      }

      function requestUpdate() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateActiveSection);
        }
      }

      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          var target = document.querySelector(link.getAttribute('href'));
          if (!target) return;
          event.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setActive(link.getAttribute('data-section-link'));
          history.replaceState(null, '', link.getAttribute('href'));
        });
      });

      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate);
      updateActiveSection();
    })();
  </script>

</body>
