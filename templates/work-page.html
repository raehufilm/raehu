    html { scroll-behavior: smooth; }

    /* --- Site header --- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--site-header-height);
      z-index: 30;
      display: flex;
      align-items: center;

    }

    }

    /* --- Page structure --- */
    .work-pages {
      width: 100%;
      padding-top: var(--site-header-height);
      padding-left: var(--tracker-content-space);
    }

    .work-page {
      --page-padding: 0rem;
      --page-padding-double: 0rem;
      position: relative;
      width: 100%;
      scroll-margin-top: 0;
    }

    .work-page[data-page-padding] {
      --page-padding: var(--work-page-padding);
      --page-padding-double: var(--work-page-padding-double);
    }

    .work-page--bts {
      --page-padding-top: 6rem;
      min-height: calc(100vh - var(--site-header-height));
    }

    /* --- Section tracker --- */
    .section-tracker {
      position: fixed;
      top: 50%;
      left: var(--tracker-left);
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .section-tracker a {
      display: block;
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      line-height: 1.1;
      color: #6f6f6f;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .section-tracker-dot {
      --red-dot-size: 0.42em;
      --red-dot-offset-y: 0;
      margin-right: 0.45em;
      visibility: hidden;
    }

    .section-tracker a[aria-current="true"] {
      color: #f4f1ec;
    }

    .section-tracker a[aria-current="true"] .section-tracker-dot {
      visibility: visible;
    }

    .section-tracker a:hover {
      color: #f4f1ec;
    }

    /* --- Trailer facade --- */
    .trailer-wrap {
      position: relative;
      width: calc(100% - var(--page-padding-double));
      height: calc(100vh - var(--site-header-height) - var(--page-padding));
      margin: 0 var(--page-padding) var(--page-padding);
      background: #000;
      cursor: pointer;
      overflow: hidden;
    }

    .trailer-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .trailer-poster--placeholder {

    }

    .trailer-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 2s ease;
    }

    .trailer-play:hover { opacity: 1; }

    .trailer-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* --- Header block: text + hero image --- */
    .work-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }

    .work-header-text {
      padding: 3.25rem var(--page-padding) 6.5rem var(--page-padding);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .work-title {

    }

    .work-subtext {

    }

    .work-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;

    }

    .red-dot {
      --red-dot-size: 8px;
      --red-dot-color: #c0392b;
      --red-dot-offset-y: 0;
      display: block;
      width: var(--red-dot-size);
      height: var(--red-dot-size);
      background: var(--red-dot-color);
      border-radius: 50%;
      flex-shrink: 0;
      transform: translateY(var(--red-dot-offset-y));
      animation: pulse 1.6s ease-in-out infinite;
    }

    .section-tracker .red-dot {
      display: inline-block;
      vertical-align: baseline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .red-dot { animation: none; }
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 0 1rem;
        gap: 1rem;
      }

      .site-header-nav {
        gap: 0.9rem;
      }

      .site-header-nav a {
        font-size: 1.4rem;
      }
    }

    .work-header-image-wrap {
      padding: 3.25rem var(--page-padding) 6.5rem 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .work-header-image {

      object-fit: contain;
      display: block;
    }

    /* --- Grid wrapper (insets the slideshow + stills from screen edges) --- */
    .grid-wrapper {
      padding: var(--page-padding) var(--page-padding) 0;
    }

    /* --- Stills grid --- */

    .portfolio-grid > * {

    .bts-layout {
      display: grid;

    .bts-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .bts-slide.is-active {
      opacity: 1;
    }

    .bts-slide-control {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: flex;

      height: 2.75rem;

      background: transparent;

      cursor: pointer;
      opacity: 0;
      padding: 0;
      transform: translateY(-50%);
      transition: opacity 0.25s ease;
    }

    .bts-slide-control--prev {
      left: 1rem;
    }

    .bts-slide-control--next {
      right: 1rem;
    }

    .bts-slide-control:hover,
    .bts-slide-control:focus-visible {
      outline: 0;
    }

    .bts-slideshow:hover .bts-slide-control,
    .bts-slide-control:focus-visible {
      opacity: 1;
    }

    .bts-slide-control svg {
      width: 2rem;
      height: 2rem;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;

    .bts-copy {

  <script src="{{PORTFOLIO_GRID_JS_URL}}"></script>
  <script>
    // Trailer facade: swap poster for iframe on click
    (function () {
      var wrap = document.getElementById('trailer-player');
      if (!wrap) return;

      wrap.addEventListener('click', function () {
        var iframe = document.createElement('iframe');
        iframe.src = wrap.getAttribute('data-vimeo-embed');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
        iframe.setAttribute('allowfullscreen', '');
        wrap.innerHTML = '';
        wrap.appendChild(iframe);
        wrap.style.cursor = 'default';
      });
    })();

    // BTS slideshow
    (function () {
      document.querySelectorAll('.bts-slideshow').forEach(function (slideshow) {
        var slides = Array.prototype.slice.call(slideshow.querySelectorAll('.bts-slide'));
        if (slides.length < 2) return;

        var current = 0;
        var timer = null;

        function showSlide(nextIndex) {
          slides[current].classList.remove('is-active');
          current = (nextIndex + slides.length) % slides.length;
          slides[current].classList.add('is-active');
        }

        function startTimer() {
          window.clearInterval(timer);
          timer = window.setInterval(function () {
            showSlide(current + 1);
          }, 3500);
        }

        slideshow.querySelectorAll('[data-bts-slide-control]').forEach(function (control) {
          control.addEventListener('click', function () {
            var direction = control.getAttribute('data-bts-slide-control');
            showSlide(current + (direction === 'next' ? 1 : -1));
            startTimer();
          });
        });

        startTimer();
      });
    })();

    // Section tracker: update active label and smooth-scroll on click
    (function () {
      var sections = Array.prototype.slice.call(document.querySelectorAll('[data-section-page]'));
      var links = Array.prototype.slice.call(document.querySelectorAll('[data-section-link]'));
      var ticking = false;

      function setActive(sectionName) {
        links.forEach(function (link) {
          var isActive = link.getAttribute('data-section-link') === sectionName;
          if (isActive) {
            link.setAttribute('aria-current', 'true');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      }

      function updateActiveSection() {
        var anchorY = window.innerHeight * 0.4;
        var active = sections[0];

        sections.forEach(function (section) {
          var rect = section.getBoundingClientRect();
          if (rect.top <= anchorY) {
            active = section;
          }
        });

        if (active) {
          setActive(active.getAttribute('data-section-page'));
        }

        ticking = false;
      }

      function requestUpdate() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateActiveSection);
        }
      }

      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          var target = document.querySelector(link.getAttribute('href'));
          if (!target) return;
          event.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setActive(link.getAttribute('data-section-link'));
          history.replaceState(null, '', link.getAttribute('href'));
        });
      });

      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate);
      updateActiveSection();
    })();
  </script>
