name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Run generator tests
        run: python -m unittest discover -s tests

      - name: Verify generated output is up to date
        run: python scripts/generate_pages.py --verify-generated

      - name: Check media policy and size budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          LIMIT_BYTES = 800 * 1024 * 1024
          ALLOWED_EDITABLE_MEDIA = {".webp", ".mp4"}
          MEDIA_EXTENSIONS = {
              ".avif", ".bmp", ".gif", ".heic", ".jpeg", ".jpg", ".m4v", ".mkv",
              ".mov", ".mp4", ".png", ".tif", ".tiff", ".webm", ".webp",
          }

          result = subprocess.run(
              ["git", "ls-files", "-z", "-co", "--exclude-standard"],
              check=True,
              stdout=subprocess.PIPE,
          )
          paths = [
              Path(raw.decode("utf-8"))
              for raw in result.stdout.split(b"\0")
              if raw
          ]

          bad = []
          publishable_media_bytes = 0

          for path in paths:
              if not path.is_file():
                  continue

              suffix = path.suffix.lower()
              parts = path.parts
              in_editable_content = (
                  len(parts) >= 2
                  and parts[0] == "editable-content"
              )

              if in_editable_content and suffix in MEDIA_EXTENSIONS:
                  if suffix not in ALLOWED_EDITABLE_MEDIA:
                      bad.append(str(path))
                  else:
                      publishable_media_bytes += path.stat().st_size
              elif suffix in MEDIA_EXTENSIONS and suffix not in ALLOWED_EDITABLE_MEDIA:
                  bad.append(str(path))

          print(
              "Publishable editable media size: "
              f"{publishable_media_bytes / (1024 * 1024):.2f} MB / 800.00 MB"
          )

          if bad:
              print("Only .webp and .mp4 media may be published:", file=sys.stderr)
              for path in bad:
                  print(f"  {path}", file=sys.stderr)
              sys.exit(1)

          if publishable_media_bytes > LIMIT_BYTES:
              print(
                  "Publishable editable media exceeds the 800 MB repository budget.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Build Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path(".")
          site = Path("_site")
          generated = root / "generated-website"
          allowed_media = {".webp", ".mp4"}

          if site.exists():
              shutil.rmtree(site)
          if not generated.is_dir():
              raise SystemExit("Missing generated-website output folder")

          shutil.copytree(generated, site)
          (site / ".nojekyll").write_text("", encoding="utf-8")

          editable_content = root / "editable-content"
          if editable_content.exists():
              for source in editable_content.rglob("*"):
                  if not source.is_file():
                      continue
                  if source.suffix.lower() not in allowed_media:
                      continue
                  destination = site / source
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
          PY

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
